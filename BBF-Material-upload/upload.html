<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer utilities {
        .clifford {
          --color-clifford: #da373d;
        }

        .dottedb {
          background: radial-gradient(
            circle,
            lightblue 1px,
            white 0
          ); /* Dots */
          background-size: 20px 20px; /* Adjust the size of the background pattern */
        }
        .gridb {
          background: linear-gradient(to right, #fafafa 1px, transparent 1px),
            linear-gradient(to bottom, #fafafa 1px, white 1px);
          background-size: 20px 20px; /* Adjust the size of the grid */
        }
      }
    </style>
    <title>Login / Signup</title>
  </head>
  <body>
    <div
      class="min-h-screen flex items-center justify-center px-4 py-4 bg-gradient-to-br from-blue-50 to-blue-100 gridb"
    >
      <div
        id="form-container"
        class="w-full max-w-lg p-8 rounded-2xl shadow-xl border border-gray-200 bg-white transform transition-all duration-300 hover:scale-[1.01]"
      >
        <!-- Form content will be dynamically rendered here -->
      </div>
    </div>

    <script>
      // State management
      let isLogin = true;
      let error = "";

      // DOM elements
      const formContainer = document.getElementById("form-container");

      // Function to render the login form
      const renderLoginForm = () => {
        formContainer.innerHTML = `
          <div class="text-center space-y-3 mb-6">
            <h2 class="text-3xl font-bold text-gray-900">Login</h2>
            <p class="text-gray-600 text-base">Access your University account</p>
          </div>

          ${
            error
              ? `
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-r-lg mb-4 animate-pulse">
              <p class="font-semibold text-sm">${error}</p>
            </div>
          `
              : ""
          }

          <form id="auth-form" class="space-y-4">
            <div class="space-y-2">
              <label for="email" class="block text-sm font-medium text-gray-700">
                University Email
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="w-full pl-10 pr-3 py-2.5 text-sm border-2 bg-white text-gray-700 rounded-lg focus:outline-none transition-all duration-300"
                  placeholder="student@st.ug.edu.gh"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-medium text-gray-700">
                Password
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="w-full pl-10 pr-12 py-2.5 text-sm border-2 bg-white text-gray-700 rounded-lg focus:outline-none transition-all duration-300 border-gray-200 focus:border-blue-500"
                  placeholder="Enter your password"
                  required
                />
                <button
                  type="button"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center"
                  onclick="togglePassword()"
                >
                  <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="flex justify-between items-center text-sm mb-4">
              <label class="inline-flex items-center">
                <input type="checkbox" class="form-checkbox text-blue-500 rounded h-4 w-4" />
                <span class="ml-2 text-gray-600">Remember me</span>
              </label>
              <a href="#" class="text-blue-600 hover:underline text-sm">Forgot Password?</a>
            </div>

            <button
              type="submit"
              class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3.5 px-4 rounded-xl font-semibold hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 flex items-center justify-center space-x-2 text-base"
            >
              Login
            </button>

            <div class="mt-6 text-center text-sm text-gray-600">
              Don't have an account?
              <a href="/signup" class="font-medium text-blue-600 hover:underline ml-1" onclick="navigateToSignup(event)">
                Sign up
              </a>
            </div>
          </form>
        `;
      };

      // Function to render the signup form
      const renderSignupForm = () => {
        formContainer.innerHTML = `
          <div class="text-center space-y-3 mb-6">
            <h2 class="text-3xl font-bold text-gray-900">Sign Up</h2>
            <p class="text-gray-600 text-base">Create a new account</p>
          </div>

          ${
            error
              ? `
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-r-lg mb-4 animate-pulse">
              <p class="font-semibold text-sm">${error}</p>
            </div>
          `
              : ""
          }

          <form id="auth-form" class="space-y-4">
            <div class="space-y-2">
              <label for="email" class="block text-sm font-medium text-gray-700">
                University Email
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                  </svg>
                </div>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="w-full pl-10 pr-3 py-2.5 text-sm border-2 bg-white text-gray-700 rounded-lg focus:outline-none transition-all duration-300"
                  placeholder="student@st.ug.edu.gh"
                  required
                />
              </div>
            </div>

            <div class="space-y-2">
              <label for="password" class="block text-sm font-medium text-gray-700">
                Password
              </label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H8m13 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="w-full pl-10 pr-12 py-2.5 text-sm border-2 bg-white text-gray-700 rounded-lg focus:outline-none transition-all duration-300 border-gray-200 focus:border-blue-500"
                  placeholder="Enter your password"
                  required
                />
                <button
                  type="button"
                  class="absolute inset-y-0 right-0 pr-3 flex items-center"
                  onclick="togglePassword()"
                >
                  <svg class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                  </svg>
                </button>
              </div>
            </div>

            <button
              type="submit"
              class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3.5 px-4 rounded-xl font-semibold hover:from-blue-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 flex items-center justify-center space-x-2 text-base"
            >
              Sign Up
            </button>

            <div class="mt-6 text-center text-sm text-gray-600">
              Already have an account?
              <a href="/login" class="font-medium text-blue-600 hover:underline ml-1" onclick="navigateToLogin(event)">
                Login
              </a>
            </div>
          </form>
        `;
      };

      // Function to toggle password visibility
      const togglePassword = () => {
        const passwordInput = document.getElementById("password");
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;
      };

      // Function to handle form submission
      const handleFormSubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const url = isLogin
          ? "https://api.theniitettey.live/api/v1/auth/login"
          : "https://api.theniitettey.live/api/v1/auth/register";
        const payload = { email, password };

        try {
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(payload),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Something went wrong");
          }

          if (isLogin) {
            localStorage.setItem("token", data.token);
            console.log("Login successful", data);
          } else {
            console.log("Signup successful", data);
            navigateToLogin();
          }
        } catch (err) {
          error = err.message;
          renderForm();
        }
      };

      // Function to navigate to the login page
      const navigateToLogin = (e) => {
        if (e) e.preventDefault();
        isLogin = true;
        history.pushState({}, "", "/login");
        renderForm();
      };

      // Function to navigate to the signup page
      const navigateToSignup = (e) => {
        if (e) e.preventDefault();
        isLogin = false;
        history.pushState({}, "", "/signup");
        renderForm();
      };

      // Function to render the appropriate form based on the route
      const renderForm = () => {
        if (window.location.pathname === "/signup") {
          renderSignupForm();
        } else {
          renderLoginForm();
        }
        document
          .getElementById("auth-form")
          .addEventListener("submit", handleFormSubmit);
      };

      // Initial render based on the current route
      renderForm();

      // Handle back/forward navigation
      window.addEventListener("popstate", renderForm);
    </script>
  </body>
</html>
